<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f4f1ea" />
  <title>CardTap — デジタル名刺ジェネレーター</title>
  <style>
    :root{--paper:#f4f1ea;--ink:#171717;--blue:#2356e8;--lime:#b8ff4f;--line:rgba(0,0,0,.11)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}button,input,textarea{font:inherit}button,a{touch-action:manipulation}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(18px,4vw,48px);border-bottom:1px solid var(--line);background:rgba(244,241,234,.92);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:900;letter-spacing:-.04em}.logo{display:grid;width:36px;height:36px;place-items:center;border-radius:12px;background:var(--blue);color:var(--lime);font-size:20px}.steps{display:flex;gap:16px;color:#888;font-size:11px;font-weight:800}.steps b{color:var(--ink)}.beta{padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:#fff8;font-size:9px;font-weight:900;letter-spacing:.1em}.layout{display:grid;max-width:1380px;margin:auto;grid-template-columns:minmax(0,1.05fr) minmax(440px,.95fr)}.editor{padding:48px clamp(22px,5vw,78px)}form{max-width:680px}.group{margin:0 0 38px;padding:0;border:0}.legend{display:flex;align-items:center;gap:11px;margin-bottom:16px;font-size:14px;font-weight:900}.num{display:grid;width:25px;height:25px;place-items:center;border-radius:50%;background:#171717;color:#fff;font-size:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:block}.field.wide{grid-column:1/-1}.label{display:block;margin-bottom:8px;color:#666;font-size:12px;font-weight:800}.required{color:var(--blue)}input[type=text],input[type=email],input[type=tel],textarea{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:16px;outline:0;background:rgba(255,255,255,.67);font-size:14px;transition:.2s}textarea{min-height:92px;resize:vertical;line-height:1.7}input:focus,textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(35,86,232,.1)}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.theme{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#ffffff70;font-size:11px;font-weight:900;cursor:pointer}.theme.active{border-color:#111;background:#fff;box-shadow:0 3px 10px #0001}.swatches{display:flex}.swatch{width:18px;height:18px;margin-right:-4px;border:2px solid white;border-radius:50%}.custom-picker{display:none;align-items:center;gap:12px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#ffffff80}.custom-picker.show{display:flex}input[type=color]{width:48px;height:42px;padding:0;border:0;background:transparent;cursor:pointer}.small{color:#888;font-size:10px}.form-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.submit{display:flex;align-items:center;justify-content:center;gap:8px;min-width:250px;padding:16px 20px;border:0;border-radius:16px;background:#171717;color:#fff;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 14px 30px #0002;transition:.2s}.submit:hover{transform:translateY(-2px);background:var(--blue)}.submit:disabled{cursor:wait;opacity:.6}.secondary{padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:#ffffff80;font-size:12px;font-weight:900;cursor:pointer}.secondary:hover{background:#fff}.secondary.danger{color:#b42318}.notice{min-height:20px;margin:10px 0 0;color:#15803d;font-size:11px;font-weight:800}.preview-pane{position:sticky;top:0;height:100vh;overflow:auto;padding:44px 40px;background:#e9e5dc;border-left:1px solid var(--line)}.preview-wrap{max-width:500px;margin:auto}.preview-head{display:flex;justify-content:space-between;margin-bottom:14px;color:#777;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.status{color:#15803d;letter-spacing:0}.card{position:relative;isolation:isolate;min-height:570px;overflow:hidden;padding:32px;border-radius:30px;box-shadow:0 32px 80px rgba(17,24,39,.24)}.orb{position:absolute;right:-90px;top:-90px;z-index:-1;width:250px;height:250px;border-radius:50%}.ring{position:absolute;bottom:-125px;left:-60px;z-index:-1;width:270px;height:270px;border:44px solid rgba(255,255,255,.08);border-radius:50%}.card-top{display:flex;align-items:flex-start;justify-content:space-between}.avatar{display:grid;width:78px;height:78px;place-items:center;border-radius:23px;font-size:24px;font-weight:900;box-shadow:0 8px 24px #0002}.chip{padding:7px 11px;border:1px solid;border-radius:99px;font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.identity{margin-top:50px}.kana{margin:0;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.name{margin:8px 0 0;font-size:clamp(40px,7vw,62px);font-weight:900;line-height:.95;letter-spacing:-.06em}.rolebox,.projects,.contacts{margin-top:22px;padding-top:20px;border-top:1px solid}.role{font-weight:800}.company,.bio,.project-text{opacity:.72}.company{margin-top:4px;font-size:13px}.bio{margin-top:24px;font-size:13px;line-height:1.9}.projects{display:grid;gap:17px}.project-label{margin:0;font-size:8px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;opacity:.68}.project-title{margin:4px 0 0;font-size:11px;font-weight:900}.project-text{margin:6px 0 0;white-space:pre-line;font-size:11px;line-height:1.7}.contacts{display:grid;gap:7px;font-size:11px}.contact{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result{margin-top:18px;overflow:hidden;border:1px solid var(--line);border-radius:23px;background:#ffffffa8}.result-main{display:flex;align-items:center;gap:12px;padding:16px}.nfc{display:grid;width:40px;height:40px;place-items:center;border-radius:12px;background:#0000000c}.result strong{display:block;font-size:12px}.url{max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#777;font:10px ui-monospace,monospace}.result-actions{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line)}.result-actions button,.result-actions a{padding:13px 16px;border:0;background:transparent;color:inherit;text-align:center;text-decoration:none;font-size:12px;font-weight:900;cursor:pointer}.result-actions a{border-left:1px solid var(--line)}.hidden{display:none!important}
    .public{min-height:100vh;padding:20px;background:#e9e5dc}.public-inner{max-width:520px;margin:auto}.public-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.share-btn{padding:10px 14px;border:1px solid var(--line);border-radius:99px;background:#ffffffaa;font-size:12px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.action{display:flex;align-items:center;justify-content:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:#ffffffbb;color:inherit;text-decoration:none;font-size:12px;font-weight:900}.action.primary{grid-column:1/-1;border-color:#171717;background:#171717;color:white}.made{text-align:center;margin:24px 0;color:#777;font-size:10px;font-weight:800}.error{max-width:520px;margin:100px auto;text-align:center}.error a{color:var(--blue);font-weight:900}
    @media(max-width:950px){.layout{display:block}.preview-pane{position:static;height:auto;border-top:1px solid var(--line);border-left:0}.steps{display:none}}@media(max-width:620px){.editor{padding:28px 18px}.grid2{grid-template-columns:1fr}.field.wide{grid-column:auto}.themes{grid-template-columns:1fr 1fr}.preview-pane{padding:32px 16px}.card{padding:27px}.submit{width:100%}.secondary{flex:1}.beta{display:none}}
  </style>
</head>
<body><div id="app"></div>
<script>
const base=new URL(".",location.href).href.split("#")[0];
const displayBase=`${location.host}${location.pathname}`;
const api="https://tapme.laborobo.chatgpt.site/api/cards";
const draftKey="cardtap:draft:v1";
const defaults={name:"山田 太郎",kana:"TARO YAMADA",role:"Creative Director",company:"Studio Ripple",bio:"ブランドとプロダクトの、らしさが伝わる体験をつくっています。",now:"ブランドリニューアル／新規プロダクトの立ち上げ",past:"地域文化プロジェクト／D2Cブランドのアートディレクション",email:"hello@example.jp",phone:"090-1234-5678",website:"https://example.jp",social:"@taroyamada",theme:"cobalt",color:"#7c3aed"};
const empty={name:"",kana:"",role:"",company:"",bio:"",now:"",past:"",email:"",phone:"",website:"",social:"",theme:"cobalt",color:"#7c3aed"};
function savedDraft(){try{return JSON.parse(localStorage.getItem(draftKey)||"null")}catch{return null}}
let state={...defaults,...(savedDraft()||{})};const app=document.querySelector("#app");
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=s=>(String(s||"ME").replace(/\s/g,"").slice(0,2)||"ME");
function colors(c){if(c.theme==="cobalt")return{bg:"#2356e8",accent:"#b8ff4f",text:"#fff",muted:"#dbeafe",line:"rgba(255,255,255,.2)"};if(c.theme==="ink")return{bg:"#171717",accent:"#ff6a3d",text:"#fff",muted:"#d6d3d1",line:"rgba(255,255,255,.16)"};if(c.theme==="sand")return{bg:"#eee7d7",accent:"#0f766e",text:"#17342f",muted:"#5c6f69",line:"rgba(23,52,47,.15)"};const h=(c.color||"#7c3aed").slice(1),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4),16),light=(r*299+g*587+b*114)/1000>155;return{bg:c.color,accent:light?"#171717":"#ffffff",text:light?"#171717":"#ffffff",muted:light?"rgba(0,0,0,.62)":"rgba(255,255,255,.72)",line:light?"rgba(0,0,0,.15)":"rgba(255,255,255,.2)"}}
function cardHTML(c){const t=colors(c);return `<article class="card" style="background:${t.bg};color:${t.text}"><div class="orb" style="background:${t.accent};opacity:${c.theme==="custom"?.24:.95}"></div><div class="ring"></div><div class="card-top"><div class="avatar" style="background:${t.accent};color:${t.bg}">${esc(initials(c.name))}</div><span class="chip" style="border-color:${t.line}">Digital card</span></div><div class="identity"><p class="kana" style="color:${t.muted}">${esc(c.kana||"YOUR NAME")}</p><h2 class="name">${esc(c.name||"お名前")}</h2><div class="rolebox" style="border-color:${t.line}"><div class="role">${esc(c.role||"肩書き")}</div><div class="company" style="color:${t.muted}">${esc(c.company||"会社名・屋号")}</div></div>${c.bio?`<p class="bio" style="color:${t.muted}">${esc(c.bio)}</p>`:""}</div>${c.now||c.past?`<div class="projects" style="border-color:${t.line}">${c.now?project("Now / Next","現在・これから",c.now,t):""}${c.past?project("Archive","これまでのプロジェクト",c.past,t):""}</div>`:""}<div class="contacts" style="border-color:${t.line};color:${t.muted}">${c.email?`<div class="contact">✉ ${esc(c.email)}</div>`:""}${c.phone?`<div class="contact">☎ ${esc(c.phone)}</div>`:""}${c.website?`<div class="contact">◎ ${esc(c.website.replace(/^https?:\/\//,""))}</div>`:""}${c.social?`<div class="contact">＠ ${esc(c.social.replace(/^@/,""))}</div>`:""}</div></article>`}
function project(label,title,text,t){return `<div><p class="project-label">${label}</p><p class="project-title">${title}</p><p class="project-text" style="color:${t.muted}">${esc(text)}</p></div>`}
function field(label,key,type="text",wide=""){return `<label class="field ${wide}"><span class="label">${label}</span><input type="${type}" data-key="${key}" value="${esc(state[key])}"></label>`}
function area(label,key,placeholder="",wide="wide"){return `<label class="field ${wide}"><span class="label">${label}</span><textarea data-key="${key}" placeholder="${esc(placeholder)}">${esc(state[key])}</textarea></label>`}
function studio(){app.innerHTML=`<header class="top"><a class="brand" href="${base}"><span class="logo">◖))</span>CardTap</a><div class="steps"><b>01 入力</b><span>02 確認</span><span>03 シェア</span></div><span class="beta">GITHUB EDITION</span></header><main class="layout"><section class="editor"><form id="form"><fieldset class="group"><legend class="legend"><span class="num">1</span>基本プロフィール</legend><div class="grid2">${field('お名前 <b class="required">*</b>','name')}${field('英字・ふりがな','kana')}${field('肩書き','role')}${field('会社名・屋号','company')}${area('ひとこと紹介','bio')}</div></fieldset><fieldset class="group"><legend class="legend"><span class="num">2</span>連絡先</legend><div class="grid2">${field('メール','email','email')}${field('電話番号','phone','tel')}${field('Webサイト','website')}${field('SNSアカウント','social')}</div></fieldset><fieldset class="group"><legend class="legend"><span class="num">3</span>プロジェクト</legend><div class="grid2">${area('現在開催中のプロジェクト・これからやるプロジェクト','now','進行中の活動や今後の予定')}${area('すでに行ったプロジェクト','past','これまでのプロジェクトや実績')}</div></fieldset><fieldset class="group"><legend class="legend"><span class="num">4</span>カラーテーマ</legend><div class="themes">${themeButton('cobalt','Cobalt',['#2356e8','#b8ff4f'])}${themeButton('ink','Ink',['#171717','#ff6a3d'])}${themeButton('sand','Sand',['#eee7d7','#0f766e'])}${themeButton('custom','カスタム',[state.color])}</div><div class="custom-picker ${state.theme==='custom'?'show':''}" id="picker"><input type="color" id="color" value="${state.color}"><div><b>好きな色を選択</b><div class="small" id="hex">${state.color}</div></div></div></fieldset><div class="form-actions"><button class="submit" id="create" type="submit">✣ この内容で名刺をつくる</button><button class="secondary" id="saveDraft" type="button">一時保存</button><button class="secondary danger" id="clear" type="button">クリア</button></div><p class="notice" id="notice" aria-live="polite"></p></form></section><aside class="preview-pane"><div class="preview-wrap"><div class="preview-head"><span>Live preview</span><span class="status">● 端末内に一時保存</span></div><div id="preview">${cardHTML(state)}</div><div class="result" id="result"><div class="result-main"><span class="nfc">◖))</span><div><strong>NFC対応・約50文字のGitHub URL</strong><div class="url" id="url">${displayBase}#xxxxxxx</div></div></div><div class="result-actions hidden" id="resultActions"><button type="button" id="copy">URLをコピー</button><a id="open" target="_blank">↗</a></div></div></div></aside></main>`;bind()}
function themeButton(id,label,cols){return `<button type="button" class="theme ${state.theme===id?'active':''}" data-theme="${id}"><span class="swatches">${cols.map(c=>`<i class="swatch" style="background:${c}"></i>`).join('')}</span><span>${label}</span><span>${state.theme===id?'✓':''}</span></button>`}
function showNotice(message,isError=false){const el=document.querySelector('#notice');if(!el)return;el.textContent=message;el.style.color=isError?'#b42318':'#15803d'}
function bind(){
  document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',e=>{state[e.target.dataset.key]=e.target.value;document.querySelector('#preview').innerHTML=cardHTML(state)}));
  document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{state.theme=b.dataset.theme;studio()}));
  document.querySelector('#color').addEventListener('input',e=>{state.color=e.target.value;document.querySelector('#hex').textContent=state.color;document.querySelector('#preview').innerHTML=cardHTML(state);document.querySelector('[data-theme=custom] .swatch').style.background=state.color});
  document.querySelector('#saveDraft').addEventListener('click',()=>{localStorage.setItem(draftKey,JSON.stringify(state));showNotice('この端末に一時保存しました ✓')});
  document.querySelector('#clear').addEventListener('click',()=>{if(!confirm('入力内容と一時保存をクリアしますか？'))return;localStorage.removeItem(draftKey);state={...empty};studio();showNotice('入力内容をクリアしました')});
  document.querySelector('#form').addEventListener('submit',async e=>{
    e.preventDefault();if(!state.name.trim())return showNotice('お名前を入力してください。',true);
    const create=document.querySelector('#create');create.disabled=true;create.textContent='短いURLを発行中…';showNotice('');
    try{
      const response=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(toPayload(state))});
      const result=await response.json();if(!response.ok||!result.id)throw new Error(result.error||'URLを発行できませんでした。');
      const url=`${base}#${result.id}`;
      document.querySelector('#url').textContent=`${url}（${url.length}文字）`;document.querySelector('#open').href=url;document.querySelector('#resultActions').classList.remove('hidden');
      document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(url);document.querySelector('#copy').textContent='コピーしました ✓';setTimeout(()=>document.querySelector('#copy').textContent='URLをコピー',1700)};
      document.querySelector('#result').scrollIntoView({behavior:'smooth',block:'center'});showNotice('約50文字の共有URLを発行しました ✓');
    }catch(error){showNotice(error instanceof Error?error.message:'URLを発行できませんでした。',true)}finally{create.disabled=false;create.textContent='✣ この内容で名刺をつくる'}
  })
}
async function encode(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));if('CompressionStream'in window){const s=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));const bytes=new Uint8Array(await new Response(s).arrayBuffer());return'g'+b64(bytes)}return'j'+b64(raw)}
async function decode(token){const bytes=unb64(token.slice(1));let raw=bytes;if(token[0]==='g'){const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));raw=new Uint8Array(await new Response(s).arrayBuffer())}return JSON.parse(new TextDecoder().decode(raw))}
function b64(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
function toPayload(c){return{name:c.name,nameKana:c.kana,role:c.role,company:c.company,bio:c.bio,currentProjects:c.now,pastProjects:c.past,email:c.email,phone:c.phone,website:c.website,social:c.social,theme:c.theme,customColor:c.color}}
function fromPayload(c){return{name:c.name,kana:c.nameKana,role:c.role,company:c.company,bio:c.bio,now:c.currentProjects,past:c.pastProjects,email:c.email,phone:c.phone,website:c.website,social:c.social,theme:c.theme,color:c.customColor}}
async function loadShort(id){
  app.innerHTML=`<div class="error"><h1>名刺を読み込んでいます</h1><p>少しだけお待ちください。</p></div>`;
  try{const response=await fetch(`${api}?id=${encodeURIComponent(id)}`);const result=await response.json();if(!response.ok)throw new Error(result.error||'名刺を開けませんでした');publicView(fromPayload(result))}
  catch(error){app.innerHTML=`<div class="error"><h1>名刺を開けませんでした</h1><p>${esc(error instanceof Error?error.message:'時間をおいて再度お試しください。')}</p><a href="${base}">CardTapへ戻る</a></div>`}
}
function vcard(c){return['BEGIN:VCARD','VERSION:3.0',`FN:${c.name}`,c.company&&`ORG:${c.company}`,c.role&&`TITLE:${c.role}`,c.email&&`EMAIL:${c.email}`,c.phone&&`TEL:${c.phone}`,c.website&&`URL:${c.website}`,'END:VCARD'].filter(Boolean).join('\r\n')}
function publicView(c){const mail=c.email?`<a class="action" href="mailto:${esc(c.email)}">✉ メール</a>`:'',phone=c.phone?`<a class="action" href="tel:${esc(c.phone.replace(/[^\d+]/g,''))}">☎ 電話する</a>`:'';app.innerHTML=`<main class="public"><div class="public-inner"><header class="public-head"><a class="brand" href="${base}"><span class="logo">◖))</span>CardTap</a><button class="share-btn" id="share">↗ シェア</button></header>${cardHTML(c)}<div class="actions"><a class="action primary" download="${esc(c.name)}.vcf" href="data:text/vcard;charset=utf-8,${encodeURIComponent(vcard(c))}">＋ 連絡先に追加</a>${mail}${phone}</div><p class="made"><a href="${base}">自分の名刺をつくる</a></p></div></main>`;document.querySelector('#share').onclick=async()=>navigator.share?navigator.share({title:`${c.name}｜${c.company}`,url:location.href}):navigator.clipboard.writeText(location.href)}
(async()=>{const hash=location.hash.slice(1);if(hash.startsWith('c=')){try{publicView(await decode(hash.slice(2)))}catch{app.innerHTML='<div class="error"><h1>名刺を開けませんでした</h1><a href="'+base+'">CardTapへ戻る</a></div>'}}else if(/^[23456789abcdefghjkmnpqrstuvwxyz]{7}$/.test(hash)){await loadShort(hash)}else studio()})();
  </script>
</body>
</html>
